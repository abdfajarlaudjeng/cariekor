<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analisis Angka Lemah</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #eef2f5; max-width: 700px; margin: auto; }
    h1, h2 { text-align: center; color: #333; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input[type="text"] {
      padding: 8px; width: 100%; max-width: 300px; font-size: 16px;
      border: 1px solid #ccc; border-radius: 5px;
    }
    button {
      margin-top: 20px; padding: 10px 20px; background-color: #007bff;
      color: white; border: none; border-radius: 5px; cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    .result {
      margin-top: 25px; background: white; padding: 15px;
      border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .rumus { margin-bottom: 10px; }
    .section { margin-top: 30px; }
  </style>
</head>
<body>

  <h1>Analisis Angka Lemah</h1>

  <label for="duaD">2D (misal: 67):</label>
  <input type="text" id="duaD" maxlength="2">

  <label for="angka3">3D (misal: 186):</label>
  <input type="text" id="angka3" maxlength="3">

  <label for="ekorSebelumnya">Ekor Sebelumnya:</label>
  <input type="text" id="ekorSebelumnya" maxlength="1">

  <label for="ekorHariIni">Ekor Hari Ini:</label>
  <input type="text" id="ekorHariIni" maxlength="1">

  <label for="angka4">4D Hari Ini (misal: 2341):</label>
  <input type="text" id="angka4" maxlength="4">

  <label for="angka4kemarin">4D Kemarin (misal: 0057):</label>
  <input type="text" id="angka4kemarin" maxlength="4">

  <button onclick="hitungSemua()">Hitung</button>
  <button onclick="kirimSpreadsheet()">Simpan ke Spreadsheet</button>

  <div class="result section" id="hasilEkor"></div>
  <div class="result section" id="hasilKepala"></div>

  <script>
    const indexAngka = [9,8,7,6,5,4,3,2,1,0]; // index angka 0–9
    const webAppURL = "https://script.google.com/macros/s/AKfycbydf6bq52B_EeZAXJReP8Rr84-VlqWh-VBIlMHmRUR0DQTtb5SwdqvO0fVfnilf4rNpwQ/exec"; // GANTI DI SINI

    let hasilData = {}; // disimpan global untuk dikirim

    function hitungSemua() {
      const duaD = document.getElementById("duaD").value;
      const angka3 = document.getElementById("angka3").value;
      const ekor1 = parseInt(document.getElementById("ekorSebelumnya").value);
      const ekor2 = parseInt(document.getElementById("ekorHariIni").value);
      const angka4 = document.getElementById("angka4").value;
      const angka4kemarin = document.getElementById("angka4kemarin").value;

      if (duaD.length !== 2 || angka3.length !== 3 || angka4.length !== 4 || angka4kemarin.length !== 4 ||
          isNaN(ekor1) || isNaN(ekor2)) {
        alert("Isi semua input dengan benar.");
        return;
      }

      // Rumus Ekor Lemah
      const d1 = parseInt(duaD[0]);
      const d2 = parseInt(duaD[1]);
      const jml2D = d1 + d2;
      const r1 = jml2D - 1;
      const r2 = (jml2D % 10 + 2) % 10;
      const r3 = indexAngka[jml2D % 10];
      const as = parseInt(angka3[0]);
      const kop = parseInt(angka3[1]);
      const kepala = parseInt(angka3[2]);
      const r4 = indexAngka[as];
      const r5 = (ekor1 + ekor2) % 10;
      const r6 = (as + kop + kepala - 1 + 10) % 10;

      // Rumus Kepala Lemah
      const as4 = parseInt(angka4[0]);
      const kop4 = parseInt(angka4[1]);
      const ekor4 = parseInt(angka4[3]);
      const asKemarin = parseInt(angka4kemarin[0]);
      const k1 = (as4 + kop4) % 10;
      const k2 = (as4 + asKemarin) % 10;
      const k3 = (as4 + ekor4) % 10;

      // Tampilkan
      document.getElementById("hasilEkor").innerHTML = `
        <h2>Hasil Ekor Lemah</h2>
        <div class="rumus">Rumus 1: <b>${r1}</b></div>
        <div class="rumus">Rumus 2: <b>${r2}</b></div>
        <div class="rumus">Rumus 3: <b>${r3}</b></div>
        <div class="rumus">Rumus 4: <b>${r4}</b></div>
        <div class="rumus">Rumus 5: <b>${r5}</b></div>
        <div class="rumus">Rumus 6: <b>${r6}</b></div>
      `;
      document.getElementById("hasilKepala").innerHTML = `
        <h2>Hasil Kepala Lemah</h2>
        <div class="rumus">Rumus 1: <b>${k1}</b></div>
        <div class="rumus">Rumus 2: <b>${k2}</b></div>
        <div class="rumus">Rumus 3: <b>${k3}</b></div>
      `;

      hasilData = { duaD, angka3, ekor1, ekor2, r1, r2, r3, r4, r5, r6, angka4, angka4kemarin, k1, k2, k3 };
    }

    function kirimSpreadsheet() {
      if (!hasilData.duaD) {
        alert("Hitung dulu sebelum menyimpan.");
        return;
      }

      fetch(webAppURL, {
        method: "POST",
        body: JSON.stringify(hasilData),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.text())
      .then(msg => alert("Data berhasil disimpan ke Spreadsheet."))
      .catch(err => alert("Gagal menyimpan: " + err));
    }
  </script>

</body>
</html>
